# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  # ---------- Backend API (Node.js / Express) ----------
  - type: web
    name: app-proposal-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set in Render dashboard (MongoDB Atlas connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false # set in Render dashboard (optional, for AI price search)
      - key: GEMINI_MODEL
        sync: false

  # ---------- Frontend (Vite / React static site) ----------
  - type: web
    name: app-proposal-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://app-proposal-api.onrender.com/api
    routes:
      # SPA fallback so React Router deep links (/login, /purchase/123...) work
      - type: rewrite
        source: /*
        destination: /index.html

